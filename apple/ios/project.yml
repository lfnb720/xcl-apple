name: XCL
options:
  bundleIdPrefix: com.xcl
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  # 图形层: EAGL + OpenGL ES (JNI 实现)
  XCLIOSGL:
    type: framework
    platform: iOS
    sources:
      - path: shim/native/XclIOSGL.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xcl.iosgl
        HEADER_SEARCH_PATHS: "$(SRCROOT)/XCL/include"
        OTHER_LDFLAGS: "-framework OpenGLES -framework QuartzCore -framework UIKit"

  XCL:
    type: application
    platform: iOS
    sources:
      - path: XCL
      - path: Resources/jre8
        type: folder
        buildPhase: resources
      - path: Resources/smoke.jar
        buildPhase: resources
      - path: Resources/xcl-engine.jar
        buildPhase: resources
      - path: Resources/xcl-shim.jar
        buildPhase: resources
    dependencies:
      - target: XCLIOSGL
        embed: true
    info:
      path: XCL/Info.plist
      properties:
        CFBundleDisplayName: XCL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xcl.app.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: XCL/XCL-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/XCL/include"
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "-Wl,-rpath,@executable_path/jre8/lib -Wl,-rpath,@executable_path/jre8/lib/server"
