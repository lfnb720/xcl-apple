workflows:
  ios-unsigned:
    name: XCL iOS IPA (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Build unsigned IPA
        script: |
          chmod +x apple/ios/build_ios_ipa.sh
          bash apple/ios/build_ios_ipa.sh
    artifacts:
      - apple/ios/build/XCL.ipa
